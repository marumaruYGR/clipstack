[package]
name = "jianzhan-core"
version = "1.1.2"
edition = "2021"
rust-version = "1.89"

[lib]
path = "Core.rs"
crate-type = ["staticlib"]

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
zeroize = "1.8.2"

[profile.release]
opt-level = 3
panic = "abort"
